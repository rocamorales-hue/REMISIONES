<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Password Vault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fff5f7',
                            100: '#ffe6ed',
                            200: '#fecddb',
                            300: '#fba5be',
                            400: '#f77298',
                            500: '#ee4374',
                            600: '#dc2658',
                            700: '#b81944',
                        },
                        cream: '#fffdfa',
                        softPink: '#fdf0f4',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        cursive: ['Sacramento', 'cursive'],
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -5px rgba(238, 67, 116, 0.08)',
                        'pink-glow': '0 8px 25px -5px rgba(247, 114, 152, 0.25)',
                        'card': '0 20px 40px -15px rgba(220, 38, 88, 0.07)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #fff5f7 0%, #ffe6ed 50%, #fde8ef 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(251, 165, 190, 0.3);
            transition: all 0.25s ease;
        }

        .glass-input:focus {
            border-color: #f77298;
            box-shadow: 0 0 0 4px rgba(247, 114, 152, 0.15);
            outline: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff5f7;
        }
        ::-webkit-scrollbar-thumb {
            background: #fba5be;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f77298;
        }

        .pulse-pink {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
    </style>
</head>
<body class="text-gray-700 antialiased relative overflow-x-hidden pb-12">

    <!-- Decorative background blobs -->
    <div class="fixed top-[-100px] left-[-100px] w-96 h-96 bg-pink-200 rounded-full blur-3xl opacity-50 pointer-events-none pulse-pink"></div>
    <div class="fixed bottom-[-100px] right-[-100px] w-96 h-96 bg-pink-300 rounded-full blur-3xl opacity-40 pointer-events-none pulse-pink" style="animation-delay: 1.5s;"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 ease-out flex items-center gap-3 bg-white/90 backdrop-blur-md px-5 py-3.5 rounded-2xl shadow-pink-glow border border-pink-200">
        <div class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-500">
            <i class="fa-solid fa-check text-sm"></i>
        </div>
        <div>
            <p id="toast-message" class="text-sm font-semibold text-gray-800">Copied to clipboard!</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 pt-10">

        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-soft text-pink-400 mb-3 border border-pink-100">
                <i class="fa-solid fa-key text-2xl"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 tracking-tight">My Credentials</h1>
            <p class="text-pink-400 font-medium text-sm mt-1 tracking-wide">Aesthetic & Secure Password Vault</p>
        </header>

        <!-- Search & Action Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-pink-300 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterCards()" placeholder="Search platform..." 
                    class="glass-input w-full pl-10 pr-4 py-3 rounded-2xl text-sm placeholder-pink-300 text-gray-700 font-medium">
            </div>
            
            <button onclick="openModal()" 
                class="w-full sm:w-auto bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white px-6 py-3 rounded-2xl font-semibold text-sm shadow-pink-glow transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Add Account
            </button>
        </div>

        <!-- Cards Grid -->
        <div id="credentialsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamic items rendered via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 glass-card rounded-3xl p-8 border border-pink-100">
            <div class="w-16 h-16 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-4 text-pink-300 text-2xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-700">No passwords found</h3>
            <p class="text-sm text-gray-400 mt-1">Try searching for something else or add a new account.</p>
        </div>

    </div>

    <!-- Add/Edit Modal -->
    <div id="accountModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/30 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-card bg-white/90 w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-card border border-white transform scale-95 transition-transform duration-300" id="modalContainer">
            
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Add Account</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-pink-50 text-pink-400 hover:bg-pink-100 transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="accountForm" onsubmit="handleSaveAccount(event)" class="space-y-4">
                <input type="hidden" id="editId" value="">

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Platform / App Name</label>
                    <input type="text" id="modalPlatform" required placeholder="e.g. Algebraix" class="glass-input w-full px-4 py-3 rounded-xl text-sm text-gray-700">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Username / Email</label>
                    <input type="text" id="modalUsername" required placeholder="e.g. FMORALES2" class="glass-input w-full px-4 py-3 rounded-xl text-sm text-gray-700">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <input type="text" id="modalPassword" required placeholder="e.g. Frida2026" class="glass-input w-full px-4 py-3 rounded-xl text-sm text-gray-700 pr-10">
                        <button type="button" onclick="generateRandomPassword()" title="Generate Random Password" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-pink-400 hover:text-pink-500 text-sm p-1">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Note (Optional)</label>
                    <input type="text" id="modalNote" placeholder="e.g. School Portal" class="glass-input w-full px-4 py-3 rounded-xl text-sm text-gray-700">
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 rounded-xl border border-pink-200 text-gray-600 font-semibold text-sm hover:bg-pink-50 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white px-4 py-3 rounded-xl font-semibold text-sm shadow-pink-glow transition-all">
                        Save Details
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial accounts array containing Algebraix by default
        const INITIAL_DATA = [
            {
                id: '1',
                platform: 'Algebraix',
                username: 'FMORALES2',
                password: 'Frida2026',
                note: 'School Platform'
            }
        ];

        // State variables
        let accounts = [];
        let visiblePasswords = {};

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadAccounts();
            renderGrid();
        });

        // Load data from LocalStorage or default
        function loadAccounts() {
            const stored = localStorage.getItem('aesthetic_vault_accounts');
            if (stored) {
                try {
                    accounts = JSON.parse(stored);
                } catch(e) {
                    accounts = [...INITIAL_DATA];
                }
            } else {
                accounts = [...INITIAL_DATA];
                saveAccounts();
            }
        }

        // Save accounts to LocalStorage
        function saveAccounts() {
            localStorage.setItem('aesthetic_vault_accounts', JSON.stringify(accounts));
        }

        // Render Cards Grid
        function renderGrid(filterText = '') {
            const grid = document.getElementById('credentialsGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            const filtered = accounts.filter(acc => 
                acc.platform.toLowerCase().includes(filterText.toLowerCase()) ||
                acc.username.toLowerCase().includes(filterText.toLowerCase()) ||
                (acc.note && acc.note.toLowerCase().includes(filterText.toLowerCase()))
            );

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filtered.forEach(acc => {
                const isVisible = !!visiblePasswords[acc.id];
                const maskedPassword = '•'.repeat(Math.max(acc.password.length, 8));

                const cardHtml = `
                    <div class="glass-card rounded-3xl p-6 shadow-card hover:shadow-pink-glow transition-all duration-300 relative border border-white group">
                        
                        <!-- Header / Platform Name -->
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center gap-3.5">
                                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-100 to-pink-50 flex items-center justify-center text-pink-500 shadow-sm border border-pink-200/50">
                                    <i class="fa-solid fa-shield-halved text-lg"></i>
                                </div>
                                <div>
                                    <h2 class="text-lg font-bold text-gray-800 leading-snug">${escapeHtml(acc.platform)}</h2>
                                    ${acc.note ? `<span class="text-xs px-2.5 py-0.5 rounded-full bg-pink-100/70 text-pink-600 font-medium inline-block mt-0.5">${escapeHtml(acc.note)}</span>` : ''}
                                </div>
                            </div>
                            
                            <!-- Actions menu -->
                            <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                <button onclick="openModal('${acc.id}')" title="Edit" class="w-8 h-8 rounded-xl hover:bg-pink-100/60 text-gray-400 hover:text-pink-500 transition-colors flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deleteAccount('${acc.id}')" title="Delete" class="w-8 h-8 rounded-xl hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <!-- User & Password details container -->
                        <div class="space-y-3 bg-white/60 rounded-2xl p-4 border border-pink-100/60">
                            
                            <!-- Username row -->
                            <div class="flex items-center justify-between gap-2">
                                <div class="overflow-hidden">
                                    <p class="text-[11px] font-semibold tracking-wider text-pink-400 uppercase">Username / Usuario</p>
                                    <p class="text-sm font-semibold text-gray-700 truncate">${escapeHtml(acc.username)}</p>
                                </div>
                                <button onclick="copyToClipboard('${escapeJs(acc.username)}', 'Username')" title="Copy Username" 
                                    class="p-2 rounded-xl text-gray-400 hover:text-pink-500 hover:bg-pink-50 transition-colors flex-shrink-0">
                                    <i class="fa-regular fa-copy text-sm"></i>
                                </button>
                            </div>

                            <hr class="border-pink-100/50">

                            <!-- Password row -->
                            <div class="flex items-center justify-between gap-2">
                                <div class="overflow-hidden">
                                    <p class="text-[11px] font-semibold tracking-wider text-pink-400 uppercase">Password / Contraseña</p>
                                    <p class="text-sm font-mono tracking-wider font-semibold text-gray-700 truncate">
                                        ${isVisible ? escapeHtml(acc.password) : maskedPassword}
                                    </p>
                                </div>
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    <button onclick="togglePasswordVisibility('${acc.id}')" title="${isVisible ? 'Hide Password' : 'Show Password'}" 
                                        class="p-2 rounded-xl text-gray-400 hover:text-pink-500 hover:bg-pink-50 transition-colors">
                                        <i class="fa-solid ${isVisible ? 'fa-eye-slash' : 'fa-eye'} text-sm"></i>
                                    </button>
                                    <button onclick="copyToClipboard('${escapeJs(acc.password)}', 'Password')" title="Copy Password" 
                                        class="p-2 rounded-xl text-gray-400 hover:text-pink-500 hover:bg-pink-50 transition-colors">
                                        <i class="fa-regular fa-copy text-sm"></i>
                                    </button>
                                </div>
                            </div>

                        </div>

                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // Toggle Password visibility
        function togglePasswordVisibility(id) {
            visiblePasswords[id] = !visiblePasswords[id];
            renderGrid(document.getElementById('searchInput').value);
        }

        // Copy content safely
        function copyToClipboard(text, label) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(`${label} copied to clipboard! ✨`);
            } catch (err) {
                showToast(`Failed to copy`);
            }
            
            document.body.removeChild(textarea);
        }

        // Toast notification system
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 2500);
        }

        // Filter Grid via Search Input
        function filterCards() {
            const text = document.getElementById('searchInput').value;
            renderGrid(text);
        }

        // Open Modal (Add / Edit)
        function openModal(id = null) {
            const modal = document.getElementById('accountModal');
            const container = document.getElementById('modalContainer');
            const modalTitle = document.getElementById('modalTitle');
            
            document.getElementById('accountForm').reset();
            document.getElementById('editId').value = '';

            if (id) {
                const account = accounts.find(a => a.id === id);
                if (account) {
                    modalTitle.textContent = 'Edit Account';
                    document.getElementById('editId').value = account.id;
                    document.getElementById('modalPlatform').value = account.platform;
                    document.getElementById('modalUsername').value = account.username;
                    document.getElementById('modalPassword').value = account.password;
                    document.getElementById('modalNote').value = account.note || '';
                }
            } else {
                modalTitle.textContent = 'Add Account';
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }

        // Close Modal
        function closeModal() {
            const modal = document.getElementById('accountModal');
            const container = document.getElementById('modalContainer');
            
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Save account (Add / Update)
        function handleSaveAccount(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editId').value;
            const platform = document.getElementById('modalPlatform').value.trim();
            const username = document.getElementById('modalUsername').value.trim();
            const password = document.getElementById('modalPassword').value.trim();
            const note = document.getElementById('modalNote').value.trim();

            if (editId) {
                // Update existing
                accounts = accounts.map(a => a.id === editId ? { id: editId, platform, username, password, note } : a);
                showToast('Account updated successfully!');
            } else {
                // Add new
                const newAccount = {
                    id: Date.now().toString(),
                    platform,
                    username,
                    password,
                    note
                };
                accounts.unshift(newAccount);
                showToast('New account added! ✨');
            }

            saveAccounts();
            renderGrid(document.getElementById('searchInput').value);
            closeModal();
        }

        // Delete account
        function deleteAccount(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;

            // Custom non-alert confirmation check logic using card highlight
            if (confirm(`Are you sure you want to delete ${account.platform}?`)) {
                accounts = accounts.filter(a => a.id !== id);
                delete visiblePasswords[id];
                saveAccounts();
                renderGrid(document.getElementById('searchInput').value);
                showToast('Account removed');
            }
        }

        // Random password generator helper
        function generateRandomPassword() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
            let password = '';
            for (let i = 0; i < 12; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('modalPassword').value = password;
        }

        // Sanitize string helpers
        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function escapeJs(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
