<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Financiera Completa</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 20px;
      color: #111827;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Tab Content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
    }

    input, select {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn-calc {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-calc:hover {
      background-color: var(--primary-hover);
    }

    /* Results */
    .results-container {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid var(--border);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .card.highlight {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #065f46;
    }

    /* Table */
    .table-wrapper {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f9fafb;
      position: sticky;
      top: 0;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calculadora Financiera</h1>

    <!-- Tabs Navigation -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('mora')">Interés Moratorio</button>
      <button class="tab-btn" onclick="switchTab('simple')">Interés Simple</button>
      <button class="tab-btn" onclick="switchTab('compuesto')">Interés Compuesto</button>
    </div>

    <!-- 1. TAB MORATORIO -->
    <div id="mora" class="tab-content active">
      <div class="form-grid">
        <div class="form-group">
          <label for="mora-monto">Monto Vencido / Cuota ($)</label>
          <input type="number" id="mora-monto" placeholder="Ej. 10000" value="10000">
        </div>
        <div class="form-group">
          <label for="mora-tasa">Tasa Moratoria Anual (%)</label>
          <input type="number" id="mora-tasa" placeholder="Ej. 24" value="24">
        </div>
        <div class="form-group">
          <label for="mora-dias">Días de Atraso</label>
          <input type="number" id="mora-dias" placeholder="Ej. 15" value="15">
        </div>
        <div class="form-group">
          <label for="mora-base">Base Comercial (Días/Año)</label>
          <select id="mora-base">
            <option value="360" selected>360 Días (Comercial/Bancaria)</option>
            <option value="365">365 Días (Año Natural)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="mora-iva">Aplica IVA a Intereses</label>
          <select id="mora-iva">
            <option value="16" selected>Sí (16%)</option>
            <option value="0">No (0%)</option>
          </select>
        </div>
      </div>
      <button class="btn-calc" onclick="calcularMoratorio()">Calcular Moratorio</button>
    </div>

    <!-- 2. TAB SIMPLE -->
    <div id="simple" class="tab-content">
      <div class="form-grid">
        <div class="form-group">
          <label for="simple-monto">Capital Inicial ($)</label>
          <input type="number" id="simple-monto" placeholder="Ej. 50000" value="50000">
        </div>
        <div class="form-group">
          <label for="simple-tasa">Tasa de Interés Anual (%)</label>
          <input type="number" id="simple-tasa" placeholder="Ej. 10" value="10">
        </div>
        <div class="form-group">
          <label for="simple-tiempo">Plazo (Meses)</label>
          <input type="number" id="simple-tiempo" placeholder="Ej. 12" value="12">
        </div>
      </div>
      <button class="btn-calc" onclick="calcularSimple()">Calcular Interés Simple</button>
    </div>

    <!-- 3. TAB COMPUESTO -->
    <div id="compuesto" class="tab-content">
      <div class="form-grid">
        <div class="form-group">
          <label for="comp-monto">Depósito Inicial ($)</label>
          <input type="number" id="comp-monto" placeholder="Ej. 10000" value="10000">
        </div>
        <div class="form-group">
          <label for="comp-aportacion">Aportación Mensual ($)</label>
          <input type="number" id="comp-aportacion" placeholder="Ej. 1000" value="1000">
        </div>
        <div class="form-group">
          <label for="comp-tasa">Tasa de Rendimiento Anual (%)</label>
          <input type="number" id="comp-tasa" placeholder="Ej. 11" value="11">
        </div>
        <div class="form-group">
          <label for="comp-anos">Plazo (Años)</label>
          <input type="number" id="comp-anos" placeholder="Ej. 5" value="5">
        </div>
      </div>
      <button class="btn-calc" onclick="calcularCompuesto()">Calcular Interés Compuesto</button>
    </div>

    <!-- RESULTADOS COMUNES -->
    <div class="results-container" id="results" style="display: none;">
      <div class="cards-grid" id="cards-container"></div>
      <div id="table-container"></div>
    </div>
  </div>

  <script>
    // Formateador de Moneda
    const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

    // Cambiar entre pestañas
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      document.getElementById('results').style.display = 'none';
    }

    // CÁLCULO DE INTERÉS MORATORIO
    function calcularMoratorio() {
      const monto = parseFloat(document.getElementById('mora-monto').value) || 0;
      const tasaAnual = parseFloat(document.getElementById('mora-tasa').value) || 0;
      const dias = parseFloat(document.getElementById('mora-dias').value) || 0;
      const baseDias = parseFloat(document.getElementById('mora-base').value) || 360;
      const ivaPct = parseFloat(document.getElementById('mora-iva').value) || 0;

      const tasaDiaria = (tasaAnual / 100) / baseDias;
      const interesMoratorio = monto * tasaDiaria * dias;
      const iva = interesMoratorio * (ivaPct / 100);
      const totalPagar = monto + interesMoratorio + iva;

      mostrarResultados([
        { title: 'Capital Vencido', value: fmt.format(monto) },
        { title: 'Interés Moratorio', value: fmt.format(interesMoratorio) },
        { title: `IVA (${ivaPct}%)`, value: fmt.format(iva) },
        { title: 'Total a Pagar', value: fmt.format(totalPagar), highlight: true }
      ]);
    }

    // CÁLCULO DE INTERÉS SIMPLE
    function calcularSimple() {
      const capital = parseFloat(document.getElementById('simple-monto').value) || 0;
      const tasaAnual = parseFloat(document.getElementById('simple-tasa').value) || 0;
      const meses = parseFloat(document.getElementById('simple-tiempo').value) || 0;

      const interes = capital * (tasaAnual / 100) * (meses / 12);
      const total = capital + interes;

      mostrarResultados([
        { title: 'Capital Inicial', value: fmt.format(capital) },
        { title: 'Interés Generado', value: fmt.format(interes) },
        { title: 'Monto Total', value: fmt.format(total), highlight: true }
      ]);
    }

    // CÁLCULO DE INTERÉS COMPUESTO
    function calcularCompuesto() {
      const inicial = parseFloat(document.getElementById('comp-monto').value) || 0;
      const aportacion = parseFloat(document.getElementById('comp-aportacion').value) || 0;
      const tasaAnual = parseFloat(document.getElementById('comp-tasa').value) || 0;
      const anos = parseInt(document.getElementById('comp-anos').value) || 0;

      const tasaMensual = (tasaAnual / 100) / 12;
      const totalMeses = anos * 12;

      let saldo = inicial;
      let totalAportado = inicial;
      let totalInteres = 0;

      let tablaHTML = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Mes</th>
                <th>Aportaciones</th>
                <th>Interés Ganado</th>
                <th>Saldo Final</th>
              </tr>
            </thead>
            <tbody>
      `;

      for (let m = 1; m <= totalMeses; m++) {
        const interesMes = saldo * tasaMensual;
        saldo += interesMes + aportacion;
        totalAportado += aportacion;
        totalInteres += interesMes;

        // Mostrar solo filas principales o cada 6 meses si es muy largo
        if (totalMeses <= 24 || m % 6 === 0 || m === totalMeses) {
          tablaHTML += `
            <tr>
              <td>Mes ${m}</td>
              <td>${fmt.format(totalAportado)}</td>
              <td>${fmt.format(interesMes)}</td>
              <td><strong>${fmt.format(saldo)}</strong></td>
            </tr>
          `;
        }
      }

      tablaHTML += '</tbody></table></div>';

      mostrarResultados([
        { title: 'Inversión Total', value: fmt.format(totalAportado) },
        { title: 'Intereses Ganados', value: fmt.format(totalInteres) },
        { title: 'Saldo Final Estimado', value: fmt.format(saldo), highlight: true }
      ], tablaHTML);
    }

    // MOSTRAR TARJETAS Y TABLA
    function mostrarResultados(cards, tableHTML = '') {
      const resultsContainer = document.getElementById('results');
      const cardsContainer = document.getElementById('cards-container');
      const tableContainer = document.getElementById('table-container');

      cardsContainer.innerHTML = cards.map(c => `
        <div class="card ${c.highlight ? 'highlight' : ''}">
          <div class="card-title">${c.title}</div>
          <div class="card-value">${c.value}</div>
        </div>
      `).join('');

      tableContainer.innerHTML = tableHTML;
      resultsContainer.style.display = 'block';
    }

    // Ejecutar cálculo inicial al cargar
    calcularMoratorio();
  </script>
</body>
</html>
